name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "فایل زیپ پیدا نشد!"
          exit 1
        fi
        unzip "$ZIP_FILE" -d project_src
        
        echo "--- لیست فایل‌های استخراج شده ---"
        ls -R project_src

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3

    - name: Build with Gradle
      run: |
        # پیدا کردن فایل تنظیمات پروژه (چه با پسوند kts و چه بدون آن)
        SETTINGS_FILE=$(find project_src -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
        
        if [ -z "$SETTINGS_FILE" ]; then
          echo "خطا: فایل settings.gradle پیدا نشد. ساختار زیپ شما اشتباه است."
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$SETTINGS_FILE")
        cd "$PROJECT_DIR"
        
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SignalTracker-APK
        path: project_src/**/build/outputs/apk/debug/*.apk
