name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Unzip project
      run: |
        # پیدا کردن هر فایل زیپی که در صفحه اصلی است (مثل sp2ll.zip)
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "خطا: هیچ فایل زیپی در صفحه اصلی مخزن پیدا نشد!"
          exit 1
        fi
        echo "در حال باز کردن فایل: $ZIP_FILE"
        unzip "$ZIP_FILE" -d project_src
        
        cd project_src
        # اگر فایل‌ها در یک پوشه اضافه بودند، آن‌ها را به روت منتقل میکنیم
        if [ $(ls -1 | wc -l) -eq 1 ] && [ -d $(ls -1) ]; then
          mv $(ls -1)/* .
          mv $(ls -1)/.* . 2>/dev/null || true
        fi

    - name: Build with Gradle
      run: |
        cd project_src
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SignalTracker-APK
        path: project_src/app/build/outputs/apk/debug/*.apk
