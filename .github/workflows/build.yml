name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "فایل زیپ پیدا نشد!"
          exit 1
        fi
        unzip "$ZIP_FILE" -d project_src

    - name: Build with Gradle
      run: |
        # پیدا کردن فایل gradlew در هر عمقی از پوشه پروژه
        GRADLEW_PATH=$(find project_src -name "gradlew" | head -n 1)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "خطا: فایل gradlew پیدا نشد. لطفا مطمئن شوید کل پوشه پروژه را زیپ کرده‌اید."
          exit 1
        fi
        
        # رفتن به پوشه‌ای که gradlew در آن قرار دارد
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        cd "$PROJECT_DIR"
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SignalTracker-APK
        # پیدا کردن فایل APK در هر عمقی از پوشه پروژه
        path: project_src/**/build/outputs/apk/debug/*.apk
