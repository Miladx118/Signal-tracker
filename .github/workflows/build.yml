name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "فایل زیپ پیدا نشد!"
          exit 1
        fi
        unzip "$ZIP_FILE" -d project_src
        
        cd project_src
        if [ $(ls -1 | wc -l) -eq 1 ] && [ -d $(ls -1) ]; then
          mv $(ls -1)/* .
          mv $(ls -1)/.* . 2>/dev/null || true
        fi

    - name: Build with Gradle
      run: |
        cd project_src
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SignalTracker-APK
        path: project_src/app/build/outputs/apk/debug/*.apk
